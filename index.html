<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>影之诗计血器</title>
<style>
:root {
  --bg: #f3f1ee;
  --top: #fbe4e4;
  --bottom: #e2ebfb;
  --text: #1d1d22;
  --muted: #8a8a94;
  --btn: rgba(0,0,0,.08);
  --btn-active: rgba(0,0,0,.18);
  --bar: #ffffff;
  --accent: #6c4bd6;
  --die: #ffffff;
  --pip: #1d1d22;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #101014; --top: #3a1d22; --bottom: #1b2640; --text: #f2f2f6; --muted: #8d8d99;
    --btn: rgba(255,255,255,.12); --btn-active: rgba(255,255,255,.26);
    --bar: #1b1b22; --accent: #a68cff; --die: #f2f2f6; --pip: #15151a;
  }
}
:root[data-theme="dark"] {
  --bg: #101014; --top: #3a1d22; --bottom: #1b2640; --text: #f2f2f6; --muted: #8d8d99;
  --btn: rgba(255,255,255,.12); --btn-active: rgba(255,255,255,.26);
  --bar: #1b1b22; --accent: #a68cff; --die: #f2f2f6; --pip: #15151a;
}
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overscroll-behavior: none;
}
.app { height: 100%; display: flex; flex-direction: column; }
.half {
  flex: 1; min-height: 0;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 4vw;
}
.half.top { background: var(--top); transform: rotate(180deg); }
.half.bottom { background: var(--bottom); }
.num {
  flex: 1; text-align: center;
  font-size: clamp(88px, 30vw, 180px);
  font-weight: 800; line-height: 1;
  font-variant-numeric: tabular-nums;
  transition: transform .12s;
}
.num.pop { transform: scale(1.08); }
.num.zero { color: var(--muted); }
.adj {
  width: 24vw; max-width: 130px; aspect-ratio: 1;
  border: 0; border-radius: 50%;
  background: var(--btn); color: var(--text);
  font-size: clamp(40px, 12vw, 64px); font-weight: 300; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; padding: 0;
}
.adj:active { background: var(--btn-active); }
.adj:disabled { opacity: .3; cursor: default; }
.bar {
  position: relative; flex: none; height: 92px;
  background: var(--bar);
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 -2px 10px rgba(0,0,0,.12), 0 2px 10px rgba(0,0,0,.12);
  z-index: 1;
}
.reset {
  position: absolute; left: 4vw; top: 50%; transform: translateY(-50%);
  border: 0; border-radius: 999px; padding: 10px 18px;
  background: var(--btn); color: var(--text);
  font-size: 16px; font-weight: 600; cursor: pointer;
}
.reset:active { background: var(--btn-active); }
.die {
  width: 68px; height: 68px; border: 0; border-radius: 14px; padding: 8px;
  background: var(--die); box-shadow: 0 3px 10px rgba(0,0,0,.28);
  display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  cursor: pointer;
}
.die:active { transform: scale(.95); }
.die.rolling { animation: shake .5s ease-in-out; }
.pip { width: 13px; height: 13px; border-radius: 50%; background: transparent; place-self: center; }
.pip.on { background: var(--pip); }
.die-hint { position: absolute; left: calc(50% + 46px); top: 50%; transform: translateY(-50%); font-size: 20px; font-weight: 700; color: var(--muted); }
.mico {
  position: absolute; right: 4vw; top: 50%; transform: translateY(-50%);
  color: var(--accent); font-size: 18px; font-weight: 700;
  text-decoration: underline; text-underline-offset: 4px; padding: 10px 6px;
}
.overlay {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(0,0,0,.72);
  display: none; flex-direction: column; align-items: center; justify-content: center;
  padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
}
.overlay.open { display: flex; }
.overlay img { max-width: 92vw; max-height: 78vh; background: #fff; border-radius: 14px; }
.overlay p { color: #fff; opacity: .8; font-size: 14px; margin: 14px 0 0; }
@keyframes shake {
  0% { transform: rotate(0) scale(1); }
  25% { transform: rotate(-18deg) scale(1.1); }
  50% { transform: rotate(14deg) scale(1.1); }
  75% { transform: rotate(-8deg) scale(1.05); }
  100% { transform: rotate(0) scale(1); }
}
</style>
</head>
<body>
<div class="app">
  <section class="half top">
    <button class="adj" data-p="0" data-d="-1" aria-label="减少">−</button>
    <div class="num" id="n0">20</div>
    <button class="adj" data-p="0" data-d="1" aria-label="增加">+</button>
  </section>

  <div class="bar">
    <button class="reset" id="reset">重置</button>
    <button class="die" id="die" aria-label="掷骰子"></button>
    <div class="die-hint" id="hint"></div>
    <a class="mico" id="mico" href="#">MICO</a>
  </div>

  <section class="half bottom">
    <button class="adj" data-p="1" data-d="-1" aria-label="减少">−</button>
    <div class="num" id="n1">20</div>
    <button class="adj" data-p="1" data-d="1" aria-label="增加">+</button>
  </section>
</div>

  function render(p) {

    nums[p].classList.toggle('zero', life[p] === MIN);

  }
  function change(p, d) {
    var v = Math.min(MAX, Math.max(MIN, life[p] + d));
    if (v === life[p]) return;
    life[p] = v; render(p);
    nums[p].classList.add('pop');
    setTimeout(function () { nums[p].classList.remove('pop'); }, 120);
  }
  for (var i = 0; i < btns.length; i++) {
    btns[i].addEventListener('click', function () { change(+this.dataset.p, +this.dataset.d); });
  }
  document.getElementById('reset').addEventListener('click', function () {
    life = [START, START]; render(0); render(1);
  });
  render(0); render(1);

  /* MICO 图片弹层 */
  var overlay = document.getElementById('overlay');
  document.getElementById('mico').addEventListener('click', function (e) {
    e.preventDefault(); overlay.classList.add('open');
  });
  overlay.addEventListener('click', function () { overlay.classList.remove('open'); });

  /* 六面骰 */
  var PIPS = {
    1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8]
  };
  var die = document.getElementById('die');
  var hint = document.getElementById('hint');
  var cells = [];
  for (var c = 0; c < 9; c++) {
    var s = document.createElement('span'); s.className = 'pip';
    die.appendChild(s); cells.push(s);
  }
  function show(n) {
    for (var k = 0; k < 9; k++) cells[k].classList.remove('on');
    PIPS[n].forEach(function (idx) { cells[idx].classList.add('on'); });
  }
  show(6);
  var rolling = false;
  die.addEventListener('click', function () {
    if (rolling) return;
    rolling = true; hint.textContent = '';
    die.classList.remove('rolling'); void die.offsetWidth; die.classList.add('rolling');
    var ticks = 0;
    var t = setInterval(function () {
      show(1 + Math.floor(Math.random() * 6));
      if (++ticks >= 7) {
        clearInterval(t);
        var r = 1 + Math.floor(Math.random() * 6);
        show(r); hint.textContent = r; rolling = false;
      }
    }, 70);
  });
})();
</script>
</body>
</html>
